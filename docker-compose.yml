# AegisAI — AWS EC2 / local Docker Compose
# ALB (HTTPS) → host:80 (nginx) → frontend:3000 + backend:5001
#
# Usage:
#   cp .env.example .env.aws   # set PUBLIC_BASE_URL + secrets
#   docker compose -f docker-compose.yml --env-file .env.aws up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.aws
    environment:
      PORT: "5001"
      NEXT_UI_ORIGIN: "http://frontend:3000"
      FLASK_ORIGIN: "http://backend:5001"
      ENABLE_LOCAL_HTTPS_PROXY: "false"
      SKIP_LOCAL_WEBCAM: "true"
    volumes:
      - aegis_uploads:/app/uploads
      - aegis_results:/app/results
      - aegis_data:/app/data
      - aegis_dataset:/app/dataset
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      FLASK_ORIGIN: "http://backend:5001"
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  aegis_uploads:
  aegis_results:
  aegis_data:
  aegis_dataset:

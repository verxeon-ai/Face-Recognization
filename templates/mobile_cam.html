<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Mobile Camera Streamer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background: #0f1117;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 12px;
            margin: 0;
            overflow-x: hidden;
        }
        .header-title {
            color: #4fc3f7;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        #videoElement {
            width: 100%;
            max-height: 52vh;
            border-radius: 16px;
            background: #000;
            object-fit: cover;
            border: 2px solid #6c5ce7;
        }
        .status-badge {
            font-size: 0.88rem;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 8px;
        }
        .btn-custom {
            border-radius: 12px;
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            margin: 4px;
        }
        .result-card {
            background: #1a1d2e;
            border-radius: 14px;
            border: 1px solid #2d3045;
            padding: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <i class="bi bi-phone me-1"></i> AI Phone Camera Streamer
    </div>
    <p class="text-muted small mb-2">Connected Live to PC Dashboard (SFace Deep Learning)</p>

    <!-- Video Preview on Phone -->
    <div style="position:relative;">
        <video id="videoElement" autoplay playsinline muted></video>
        <canvas id="canvasElement" style="display:none;"></canvas>
    </div>

    <!-- Live Status -->
    <div id="statusBadge" class="status-badge bg-secondary">
        <span class="spinner-border spinner-border-sm me-1"></span> Starting Camera...
    </div>

    <!-- Controls -->
    <div class="mt-2">
        <button id="btnSwitchCam" class="btn btn-outline-info btn-custom" onclick="switchCamera()">
            <i class="bi bi-arrow-repeat me-1"></i> Switch Camera
        </button>
        <button id="btnToggleStream" class="btn btn-danger btn-custom" onclick="toggleStreaming()">
            <i class="bi bi-stop-circle me-1"></i> Stop Stream
        </button>
    </div>

    <!-- Recognition Feedback on Phone -->
    <div class="result-card">
        <div class="text-muted small mb-1">Live Recognition Results:</div>
        <div id="phoneResult" class="fw-bold" style="color:#2ecc71;">
            Point camera towards any person
        </div>
    </div>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvasElement');
    const statusBadge = document.getElementById('statusBadge');
    const phoneResult = document.getElementById('phoneResult');
    let currentStream = null;
    let facingMode = 'environment'; // 'environment' = back camera, 'user' = front camera
    let isStreaming = true;
    let streamInterval = null;

    // Start Phone Camera
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        try {
            const constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            currentStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = currentStream;

            video.onloadedmetadata = () => {
                video.play();
                statusBadge.className = 'status-badge bg-success';
                statusBadge.innerHTML = '● STREAMING LIVE TO LAPTOP';
                startFrameSender();
            };
        } catch (err) {
            statusBadge.className = 'status-badge bg-danger';
            statusBadge.innerHTML = 'Camera Access Denied / Error: ' + err.name;
            console.error('Camera error:', err);
        }
    }

    // Send Frame to Server (every 120ms = ~8-10 FPS smooth)
    function startFrameSender() {
        if (streamInterval) clearInterval(streamInterval);

        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');

        streamInterval = setInterval(() => {
            if (!isStreaming || video.readyState !== video.HAVE_ENOUGH_DATA) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Data = canvas.toDataURL('image/jpeg', 0.65);

            fetch('/api/stream_phone_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Data })
            })
            .then(res => res.json())
            .then(data => {
                if (data.recognized && data.recognized.length > 0) {
                    phoneResult.innerHTML = data.recognized.map(p =>
                        `<span class="badge bg-success me-1 p-2 fs-6">${p.name} (${p.confidence}%)</span>`
                    ).join(' ');
                } else if (data.unknowns > 0) {
                    phoneResult.innerHTML = '<span class="badge bg-danger p-2 fs-6">UNKNOWN PERSON (ALERT)</span>';
                } else {
                    phoneResult.innerHTML = '<span class="text-muted">No face in view</span>';
                }
            })
            .catch(() => {});
        }, 120);
    }

    // Switch between Front & Back Camera
    function switchCamera() {
        facingMode = (facingMode === 'user') ? 'environment' : 'user';
        startCamera();
    }

    // Toggle Stream On/Off
    function toggleStreaming() {
        isStreaming = !isStreaming;
        const btn = document.getElementById('btnToggleStream');
        if (isStreaming) {
            btn.className = 'btn btn-danger btn-custom';
            btn.innerHTML = '<i class="bi bi-stop-circle me-1"></i> Stop Stream';
            statusBadge.className = 'status-badge bg-success';
            statusBadge.innerHTML = '● STREAMING LIVE TO LAPTOP';
        } else {
            btn.className = 'btn btn-success btn-custom';
            btn.innerHTML = '<i class="bi bi-play-circle me-1"></i> Resume Stream';
            statusBadge.className = 'status-badge bg-warning text-dark';
            statusBadge.innerHTML = 'Stream Paused';
        }
    }

    window.addEventListener('load', startCamera);
</script>
</body>
</html>
